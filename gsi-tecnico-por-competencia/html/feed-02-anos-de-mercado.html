<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0B2545;--blue:#13315C;--amber:#F5A623;--cream:#FFF8EC;--w:1080px;--h:1080px}
body{width:var(--w);height:var(--h);font-family:'Helvetica Neue',Arial,sans-serif;background:var(--cream);color:var(--navy);overflow:hidden;position:relative}
.pad{position:absolute;inset:80px}
.tag{display:inline-block;background:var(--amber);color:var(--navy);font-weight:800;font-size:30px;letter-spacing:2px;padding:12px 24px;border-radius:8px;text-transform:uppercase}
h1{font-size:88px;line-height:1.05;font-weight:900;letter-spacing:-2px}
h1 em{font-style:normal;color:var(--amber)}
p{font-size:38px;line-height:1.3}
.cta{position:absolute;left:80px;right:80px;bottom:80px;background:var(--amber);color:var(--navy);font-weight:900;font-size:44px;text-align:center;padding:30px;border-radius:16px}
.brand{position:absolute;left:80px;top:70px;font-weight:900;font-size:34px;letter-spacing:3px}
.brand span{color:var(--amber)}
.list li{list-style:none;font-size:46px;font-weight:700;margin:26px 0;padding-left:70px;position:relative}
.list li:before{content:'\2713';position:absolute;left:0;color:var(--amber);font-size:56px}
</style></head><body><div class="brand">GSI <span>ASSESSORIA EDUCACIONAL</span></div><div class="pad" style="top:170px"><h1>Anos de prática<br>e <em style="color:#c77d00">nenhum papel</em><br>que prove?</h1><p style="margin-top:44px;font-size:44px">O Técnico por Competência reconhece o que você já domina e completa só o que falta.</p></div><div class="cta" style="background:var(--navy);color:#fff">Fale com a GSI →</div></body></html>
